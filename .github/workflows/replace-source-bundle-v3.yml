name: Replace source bundle v3

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'replace-source-bundle-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout replacement branch
        uses: actions/checkout@v4
        with:
          ref: replace-source-bundle-v3
          fetch-depth: 0

      - name: Rebuild and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source/.bundle-parts/piece-*.b64 | tr -d '\n\r' | base64 -d > source/moe-dynamic-hybrid-arena-source-20260807.tar.gz.new
          echo "ea60e7a6d1e5697f583763b56b44334de51a7bd9ecb9627565ee1d04d1c3d7eb  source/moe-dynamic-hybrid-arena-source-20260807.tar.gz.new" | sha256sum -c -
          test "$(stat -c %s source/moe-dynamic-hybrid-arena-source-20260807.tar.gz.new)" = "184246"
          gzip -t source/moe-dynamic-hybrid-arena-source-20260807.tar.gz.new
          tar -tzf source/moe-dynamic-hybrid-arena-source-20260807.tar.gz.new >/dev/null
          mv source/moe-dynamic-hybrid-arena-source-20260807.tar.gz.new source/moe-dynamic-hybrid-arena-source-20260807.tar.gz
          rm -rf source/.bundle-parts
          rm -f .github/workflows/replace-source-bundle.yml .github/workflows/replace-source-bundle-v3.yml

      - name: Commit verified bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source .github/workflows
          git commit -m "Replace source bundle with verified archive"
          git push origin HEAD:replace-source-bundle-v3
