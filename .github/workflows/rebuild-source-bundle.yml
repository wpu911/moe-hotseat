name: Rebuild source bundle

on:
  push:
    branches:
      - replace-source-bundle-clean
    paths:
      - source/.upload/READY

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: replace-source-bundle-clean
          fetch-depth: 0

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/.upload/chunk-*.b64 | base64 -d > source/moe-dynamic-hybrid-arena-source-20260807.tar.gz
          echo "ea60e7a6d1e5697f583763b56b44334de51a7bd9ecb9627565ee1d04d1c3d7eb  source/moe-dynamic-hybrid-arena-source-20260807.tar.gz" | sha256sum -c -
          gzip -t source/moe-dynamic-hybrid-arena-source-20260807.tar.gz
          tar -tzf source/moe-dynamic-hybrid-arena-source-20260807.tar.gz >/dev/null
          rm -rf source/.upload
          rm -f .github/workflows/rebuild-source-bundle.yml

      - name: Commit clean source bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source .github/workflows/rebuild-source-bundle.yml
          git commit -m "Replace source bundle with verified complete archive"
          git push origin HEAD:replace-source-bundle-clean
